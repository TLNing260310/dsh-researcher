# Phase A eval patch — researcher-mode overlay (additive; pass AFTER the shared
# headless-eval.patch.yml).
#
# Replicates the Web deployment's shell removal for researcher conditions: on
# the Web the host disables its shell-tool copies and the researcher preset
# ships none, so researcher agents hold NO process-execution primitive. The
# headless base bundle mounts tool-pwsh (Windows) / tool-bash (POSIX) at host
# level, which would otherwise leak into researcher agents — disable them so
# the researcher condition matches its designed toolset. Standard/Plan runs do
# NOT apply this overlay (their natural toolset includes the shell, sandboxed
# read-only).

- id: tool-pwsh
  disabled: true

- id: tool-bash
  disabled: true
