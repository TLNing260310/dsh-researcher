# Phase A eval patch — shared overlay for the headless profile.
#
# Applied AFTER the headless profile's own layers (bundles + cordis.patch.yml)
# via `dsh --profile headless --patch <this-file>`. Installed together with
# eval-headless.js into the profile directory so './eval-headless.js' resolves
# against the same base either way the loader resolves it.
#
# Effects:
#   - replaces the shipped headless-runner with the eval runner;
#   - boots the frozen eval settings document (model/permission/preset default);
#   - mounts the agent-presets roster (shipped root + user root);
#   - defines the eval-read-only permission preset (sandbox read-only +
#     approval never) and makes it the default, so every fresh session is
#     pinned to read-only + never (uniform condition for all four modes);
#   - pins the approval policy to never (belt for the permission pin).
#
# Sandbox mode also comes from DSH_PERMISSION_MODE=read-only (base
# sandbox-policy row reads that env var); workspaceRoot = process.cwd() = the
# snapshot workspace the run is launched from.

- disable: headless-runner

- id: settings
  name: '@deepseek-ai/dsh-settings-file'
  config:
    path: 'C:/Users/jxgm/.dsh/profiles/headless/eval-settings.yaml'
    watch: false

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: eval-read-only
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      eval-read-only:
        sandbox: read-only
        approval: never

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
        roots:
          - path: 'C:/Users/jxgm/AppData/Roaming/npm/node_modules/@deepseek-ai/dsh/config/agent-presets'
            trust: system

    - id: eval-runner
      name: './eval-headless.js'
