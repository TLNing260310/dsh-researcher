## 缺口域强制覆盖

路由**必须**至少各选一条 `state-consistency` 与 `failure-resilience` 的透镜——这两个域是正向开发思维最容易漏掉的。

**依据（实测故障分布）**：*Metastable Failures in the Wild*（USENIX ;login:, 2022）分析数百份公开事故报告、识别 21 起：**>50% 的 sustaining effect 是 retry policy，>55% 靠 load shedding 才恢复**；Dan Luu 统计约 **50% 的 global outage 由配置变更引起**；OSDI 2014 Yuan et al.：约 200 个 bug 中 48 个 critical failure，**92% 源于错误处理代码**。
