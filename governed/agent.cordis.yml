# Governed Coding is the DSH standard coding surface with one authority
# substitution: generic dsh-tool-goal is omitted and the Project Cognition
# governor is installed instead. The model can execute and submit evidence;
# only the host governor can complete, pause, block, or stop the goal.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

      Work against an approved Project Cognition Goal Contract. Start with get_goal_contract and a baseline attempt. Execute the smallest change that advances a MUST criterion while preserving every frozen boundary and invariant. Evidence is authoritative only when it comes from the frozen verifier registry. Never claim completion in prose; call request_goal_decision and obey the host decision. SHOULD criteria do not keep the loop alive after all MUST criteria and human gates pass.

      `/researcher <question>` activates a host-enforced one-turn read-only research allowlist. `/researcher on` keeps that guarded mode active until `/researcher off`. While it is active, understand and advise but do not implement.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.env.DSH_E1_RESTRICT_TOOL_SURFACE === '1' || process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.env.DSH_E1_RESTRICT_TOOL_SURFACE === '1' || process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
  disabled: !!js process.env.DSH_E1_RESTRICT_TOOL_SURFACE === '1'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: !!js process.env.DSH_E1_RESTRICT_TOOL_SURFACE === '1'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: !!js process.env.DSH_E1_RESTRICT_TOOL_SURFACE === '1'

- id: goal-governor
  name: './plugins/goal-governor/index.js'
  config:
    role: executor

- id: planning
  name: cordis:group
  group: true
  disabled: !!js process.env.DSH_E1_RESTRICT_TOOL_SURFACE === '1'
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Explore without mutation and present a decision-complete plan through exit_plan_mode. The approved Goal Contract remains authoritative: planning cannot change its target, criteria, verifier bindings, boundaries, or invariants. A needed change to any frozen field requires a new human-approved contract revision.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      disabled: !!js process.env.DSH_E1_DISABLE_MODEL_COMPACTION === '1'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
      disabled: !!js process.env.DSH_E1_DISABLE_MODEL_COMPACTION === '1'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: delegation
  name: cordis:group
  group: true
  disabled: !!js process.env.DSH_E1_RESTRICT_TOOL_SURFACE === '1'
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: !!js process.env.DSH_E1_RESTRICT_TOOL_SURFACE === '1'
  config:
    fetch: false
    searchTimeoutMs: 60000
