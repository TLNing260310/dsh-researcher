name: 项目研究 Project Research
description: Evidence-driven, read-only Project Intelligence Layer. 基于证据的只读项目认知层：先理解项目，再决定该不该改（BUILD / DON'T BUILD / INVESTIGATE，"不知道"是合法输出）。证据分级 C0-C4 + 裁决态、Runtime Certificate 自证只读、Research → Plan → Code 的认知上游。Prevents AI coding agents from making locally correct changes that gradually break the whole project.
